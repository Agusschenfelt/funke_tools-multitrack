[project]
name = "api"
version = "0.1.0"
description = "FastAPI service: uploads, jobs, section edits and signed downloads for the multitrack tool."
requires-python = ">=3.11,<3.12"
dependencies = [
    # Light core only: no torch, librosa or demucs in the API image. Do not add the ml/analysis extras.
    "audio-core",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "python-multipart>=0.0.9",
    "rq>=2",
    "redis>=5",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "httpx",
]

[tool.uv.sources]
audio-core = { path = "../../packages/audio-core", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
