[project]
name = "audio-core"
version = "0.1.0"
description = "Audio pipelines and CLI for the multitrack and stems tool."
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy",
    "soundfile",
    "typer",
    "pydantic>=2",
    "rich",
]

[project.scripts]
audio-core = "audio_core.cli:app"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["audio_core"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
