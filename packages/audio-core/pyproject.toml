# Development pins are driven by an Intel macOS machine (no GPU, no wheels past torch 2.2.2).
# The Linux worker image MUST use torch>=2.6: torch<2.6 is in the CVE-2025-32434 range
# (remote code execution through torch.load). Keep checkpoint loads on trusted sources.

[project]
name = "audio-core"
version = "0.1.0"
description = "Audio pipelines and CLI for the multitrack and stems tool."
requires-python = ">=3.11,<3.12"
# Light core: data models, I/O, timeline, click, guide and Stage Pack build. The API installs only
# this set, so it never pulls torch, demucs or numba. Heavy dependencies live in extras below.
dependencies = [
    "numpy<2",  # cap: torch 2.2.x is built against the NumPy 1 ABI
    "soundfile",
    "typer",
    "pydantic>=2",
    "rich",
    "scipy>=1.17.1",
    "soxr>=1.1.0",
    "mido>=1.3.3",
]

[project.scripts]
audio-core = "audio_core.cli:app"

[project.optional-dependencies]
# ml: model inference (beat tracking and stem separation). Needed by the CPU worker only.
ml = [
    # Intel macOS: PyTorch publishes no wheels after 2.2.2, so cap there only.
    "torch>=2,<2.3; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "torchaudio<2.3; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    # Everywhere else (Linux worker image): torch<2.6 is in the CVE-2025-32434 range.
    "torch>=2.6; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "torchaudio>=2.6; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "beat-this>=1.1.0",
    "demucs>=4.1.0",
]
# analysis: signal analysis (key, loudness, section features). Needed by the CPU worker only.
analysis = [
    "librosa>=0.11.0",
    "pyloudnorm>=0.2.0",
    "numba<0.62",  # cap: no wheel for this Intel Mac in newer releases
    "llvmlite<0.45",  # cap: numba 0.61 requires llvmlite 0.44.x; newer has no wheel here
]
essentia = [
    "essentia>=2.1b6.dev1389",
]

[dependency-groups]
# `uv sync` installs the dev group by default, so local development and tests get every extra.
dev = [
    "pytest",
    "ruff",
    "audio-core[ml,analysis]",
]

# Linux resolves torch from the PyTorch CPU index (no CUDA/nvidia/triton wheels, much smaller image).
# macOS keeps PyPI. uv only honors [tool.uv.sources] of the project being locked, so the workers/cpu
# pyproject repeats this block;
# workers/cpu/tests/test_torch_sources.py fails if the two copies drift.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchaudio = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["audio_core"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: downloads model weights or runs model inference"]
# Plain `pytest` skips slow tests; run them with `uv run pytest -m slow`.
addopts = "-m 'not slow'"
