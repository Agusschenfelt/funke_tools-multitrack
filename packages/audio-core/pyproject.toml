[project]
name = "audio-core"
version = "0.1.0"
description = "Audio pipelines and CLI for the multitrack and stems tool."
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy<2",
    "soundfile",
    "typer",
    "pydantic>=2",
    "rich",
    "torch>=2,<2.3",
    "torchaudio<2.3",
    "beat-this>=1.1.0",
    "librosa>=0.11.0",
    "pyloudnorm>=0.2.0",
    "scipy>=1.17.1",
    "numba<0.62",
    "llvmlite<0.45",
]

[project.scripts]
audio-core = "audio_core.cli:app"

[project.optional-dependencies]
essentia = [
    "essentia>=2.1b6.dev1389",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["audio_core"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: downloads model weights or runs model inference"]
