[project]
name = "worker-cpu"
version = "0.1.0"
description = "RQ worker that runs the audio-core CPU pipelines (analysis, sections, separation, Stage Pack)."
requires-python = ">=3.11,<3.12"
dependencies = [
    # The worker is the only service that installs the heavy extras (torch, demucs, librosa).
    "audio-core[ml,analysis]",
    "rq>=2",
    "redis>=5",
]

[project.scripts]
worker-cpu = "worker_cpu.__main__:main"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "fakeredis",
]

[tool.uv.sources]
audio-core = { path = "../../packages/audio-core", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["worker_cpu"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
